name: Build desktop 1.0.2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yiju-desktop-1.0.2
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 NSIS
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      YIJU_PUBLIC_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Test public desktop workspace
        working-directory: youxi
        run: cargo test -p yiju-desktop -p mica

      - name: Install fixed Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Build public NSIS package
        working-directory: youxi/apps/desktop
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Verify and record Windows artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'youxi/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not found' }
          & 7z t $installer.FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installer integrity check failed' }
          $out = 'desktop-artifacts/windows'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $package = Join-Path $out 'Yiju_1.0.2_windows-x64_setup.exe'
          Copy-Item $installer.FullName $package
          $item = Get-Item $package
          $hash = (Get-FileHash -Algorithm SHA256 $package).Hash.ToLowerInvariant()
          @(
            "file=$($item.Name)"
            "bytes=$($item.Length)"
            "sha256=$hash"
            "version=1.0.2"
            "commit=$env:GITHUB_SHA"
            "run_id=$env:GITHUB_RUN_ID"
            "architecture=x86_64-pc-windows-msvc"
            "signing=unsigned"
            "credentials=not embedded; user-supplied credentials stay on device"
          ) | Set-Content -Encoding utf8 (Join-Path $out 'Yiju_1.0.2_windows-x64_SHA256.txt')

      - uses: actions/upload-artifact@v4
        with:
          name: yiju-1.0.2-windows-x64
          path: desktop-artifacts/windows
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS universal DMG
    runs-on: macos-14
    timeout-minutes: 120
    env:
      YIJU_PUBLIC_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install universal Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test public desktop workspace
        working-directory: youxi
        run: cargo test -p yiju-desktop -p mica

      - name: Install fixed Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Build universal companion binaries
        working-directory: youxi
        run: |
          cargo build -p yiju-desktop --release --target aarch64-apple-darwin --bins --features custom-protocol
          cargo build -p yiju-desktop --release --target x86_64-apple-darwin --bins --features custom-protocol
          mkdir -p target/universal-apple-darwin/release
          for bin in yiju-smoke yiju-gen yiju-doctor yiju-publish; do
            lipo -create \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin" \
              -output "target/universal-apple-darwin/release/$bin"
            chmod +x "target/universal-apple-darwin/release/$bin"
            codesign --force --sign - "target/universal-apple-darwin/release/$bin"
          done

      - name: Build ad-hoc signed universal app and DMG
        working-directory: youxi/apps/desktop
        run: cargo tauri build --target universal-apple-darwin --bundles app,dmg --config tauri.macbuild.conf.json

      - name: Verify and record macOS artifact
        run: |
          APP=$(find youxi/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          DMG=$(find youxi/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$APP" -a -n "$DMG"
          MAIN=$(plutil -extract CFBundleExecutable raw "$APP/Contents/Info.plist")
          BIN="$APP/Contents/MacOS/$MAIN"
          test -x "$BIN"
          ARCHS=$(lipo -archs "$BIN")
          while IFS= read -r EXEC; do
            EXEC_ARCHS=$(lipo -archs "$EXEC")
            echo "$EXEC: $EXEC_ARCHS"
            echo "$EXEC_ARCHS" | grep -q 'x86_64'
            echo "$EXEC_ARCHS" | grep -q 'arm64'
          done < <(find "$APP/Contents/MacOS" -type f -perm -111 -print)
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$DMG"
          mkdir -p desktop-artifacts/macos
          PACKAGE=desktop-artifacts/macos/Yiju_1.0.2_macos-universal.dmg
          cp "$DMG" "$PACKAGE"
          SHA=$(shasum -a 256 "$PACKAGE" | awk '{print $1}')
          BYTES=$(stat -f '%z' "$PACKAGE")
          {
            echo "file=$(basename "$PACKAGE")"
            echo "bytes=$BYTES"
            echo "sha256=$SHA"
            echo "version=1.0.2"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "architectures=$ARCHS"
            echo "signing=ad-hoc (not Developer ID signed or notarized)"
            echo "credentials=not embedded; user-supplied credentials stay on device"
          } > desktop-artifacts/macos/Yiju_1.0.2_macos-universal_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: yiju-1.0.2-macos-universal
          path: desktop-artifacts/macos
          if-no-files-found: error
          retention-days: 7
